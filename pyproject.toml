[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platewatcher"
version = "0.1.0"
description = "Lightweight LLM License Plate Extractor for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Kevon Scott", email = "kevon-dev@outlook.com"},
]
keywords = ["license-plate", "llm", "vision", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "pydantic>=2.13.3",
    "sqlalchemy>=2.0.49",
]

[project.scripts]
platewatcher = "platewatcher.main:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pre-commit>=4.6.0",
]

[tool.ruff]
line-length = 80
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".env",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
]
ignore = [
    "E501",   # line too long
]

[tool.ruff.lint.isort]
known-first-party = ["platewatcher"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=platewatcher --cov-report=term-on-missing --cov-report=html"
